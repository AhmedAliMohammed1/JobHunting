name: Live production job search smoke

on:
  push:
    branches:
      - validation/live-production-search
    paths-ignore:
      - live-production-search-result.json

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query production search API
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST 'https://job-hunting-two-gamma.vercel.app/api/jobs/search' \
            -H 'content-type: application/json' \
            --data '{"query":"Software Engineer Germany last 7 days","filters":{"limit":50}}' \
            -o response.json

          jq '{
            testedAt: (now | todateiso8601),
            query: "Software Engineer Germany last 7 days",
            jobCount: (.jobs | length),
            partial,
            providers: (.providers | map({providerId, ok, jobsReturned, errorCode})),
            countsBySource: ([.jobs[].provider] | group_by(.) | map({provider: .[0], count: length})),
            firstResults: (.jobs[:30] | map({provider, title, company, location, postedAt, sourceUrl})),
            warnings,
            disclosure,
            interpretedQuery
          }' response.json > live-production-search-result.json

          cat live-production-search-result.json

      - name: Save validation result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add live-production-search-result.json
          git diff --cached --quiet && exit 0
          git commit -m 'test: record live production search result'
          git push
