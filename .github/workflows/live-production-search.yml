# Serper production recheck 2026-08-18
name: Live production job search smoke

on:
  push:
    branches:
      - validation/live-production-search
    paths-ignore:
      - live-production-search-result.json
      - live-production-search-summary.json

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Query production search API by source
        shell: bash
        run: |
          set -euo pipefail
          BASE='https://job-hunting-two-gamma.vercel.app/api/jobs/search'
          QUERY='Software Engineer Germany last 7 days'

          run_search() {
            local name="$1"
            local provider="$2"
            local filters
            if [ -n "$provider" ]; then
              filters=$(jq -nc --arg p "$provider" '{limit:50,providers:[$p]}')
            else
              filters='{"limit":50}'
            fi
            body=$(jq -nc --arg q "$QUERY" --argjson f "$filters" '{query:$q,filters:$f}')
            curl --fail-with-body --silent --show-error \
              -X POST "$BASE" \
              -H 'content-type: application/json' \
              --data "$body" \
              -o "response-$name.json"
          }

          run_search all ''
          run_search linkedin linkedin
          run_search indeed indeed
          run_search xing xing
          run_search stepstone stepstone
          run_search glassdoor glassdoor

          jq -n \
            --slurpfile all response-all.json \
            --slurpfile linkedin response-linkedin.json \
            --slurpfile indeed response-indeed.json \
            --slurpfile xing response-xing.json \
            --slurpfile stepstone response-stepstone.json \
            --slurpfile glassdoor response-glassdoor.json \
            '{
              testedAt: (now | todateiso8601),
              query: "Software Engineer Germany last 7 days",
              all: ($all[0] | {jobCount:(.jobs|length), partial, providers:(.providers|map({providerId,ok,jobsReturned,errorCode})), countsBySource:([.jobs[].provider]|group_by(.)|map({provider:.[0],count:length}))}),
              linkedin: ($linkedin[0] | {jobCount:(.jobs|length), partial, providerHealth:(.providers|map({providerId,ok,jobsReturned,errorCode})), sampleUrls:(.jobs[:3]|map(.sourceUrl))}),
              indeed: ($indeed[0] | {jobCount:(.jobs|length), partial, providerHealth:(.providers|map({providerId,ok,jobsReturned,errorCode})), sampleUrls:(.jobs[:3]|map(.sourceUrl))}),
              xing: ($xing[0] | {jobCount:(.jobs|length), partial, providerHealth:(.providers|map({providerId,ok,jobsReturned,errorCode})), sampleUrls:(.jobs[:3]|map(.sourceUrl))}),
              stepstone: ($stepstone[0] | {jobCount:(.jobs|length), partial, providerHealth:(.providers|map({providerId,ok,jobsReturned,errorCode})), sampleUrls:(.jobs[:3]|map(.sourceUrl))}),
              glassdoor: ($glassdoor[0] | {jobCount:(.jobs|length), partial, providerHealth:(.providers|map({providerId,ok,jobsReturned,errorCode})), sampleUrls:(.jobs[:3]|map(.sourceUrl))})
            }' > live-production-search-summary.json

          cat live-production-search-summary.json

      - name: Save validation summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add live-production-search-summary.json
          git diff --cached --quiet && exit 0
          git commit -m 'test: record compact production source summary'
          git push
